[project]
name = "distil"
version = "0.1.0"
description = "AI-powered second brain for students: ingest notes, build a concept graph, surface the explainable vital-few (80/20)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "networkx>=3.4",
    "pymupdf>=1.24",
    "google-genai>=0.3",
]

[dependency-groups]
# Installed by `uv sync` (dev is included by default); excluded from the published package.
dev = [
    "pytest>=8.3",
    "httpx>=0.27",      # FastAPI TestClient transport for contract tests
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distil"]

# --- Tooling -----------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle(E/W), pyflakes(F), isort(I), pep8-naming(N), pyupgrade(UP),
# flake8-bugbear(B), comprehensions(C4), simplify(SIM).
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["distil"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["."]          # lets tests import the `tests._fakes` helpers
testpaths = ["tests"]
addopts = "-ra"
